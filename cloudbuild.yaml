options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  automapSubstitutions: true

substitutions:
  _GITHUB_REPOSITORY: "aware37/purchase_predict_api.git"

steps:
  # Étape 1 : Tests unitaires (CI)
  - name: "ghcr.io/astral-sh/uv:python3.12-trixie-slim"
    id: CI
    entrypoint: /bin/sh
    args:
      - "-c"
      - |
        chmod a+x install.sh && ./install.sh
        uv sync
        uv pip install pytest pytest-cov mlflow==3.0.1
        uv run pytest .
    env:
      - "UV_CACHE_DIR=/root/.cache/uv"

  # Étape 2 : Entraînement Kedro et envoi vers MLflow (CD)
  - name: "ghcr.io/astral-sh/uv:python3.12-trixie-slim"
    id: CD
    entrypoint: /bin/bash
    args:
      - "-c"
      - "chmod a+x install.sh && ./install.sh && uv run kedro run"
    env:
      - "ENV=$BRANCH_NAME"
      - "MLFLOW_SERVER=$_MLFLOW_SERVER"
      - "DO_NOT_TRACK=1"
      - "UV_CACHE_DIR=/root/.cache/uv"
    waitFor: ["CI"]

  # Étape 3 : Orchestration - Déclenchement du build de l'API
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: API-Deploy
    secretEnv: ["GITHUB_FGT_API"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        git clone --branch staging https://$$GITHUB_FGT_API@github.com/$_GITHUB_REPOSITORY /tmp/purchase_predict_api
        cd /tmp/purchase_predict_api
        gcloud builds submit \
          --config cloudbuild.yaml \
          --substitutions=_MLFLOW_SERVER=$_MLFLOW_SERVER \
          .
    waitFor: ["CD"]

timeout: 1200s

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-secret/versions/latest
      env: GITHUB_FGT_API
